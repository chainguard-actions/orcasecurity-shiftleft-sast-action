name: Test scan with config file, custom controls and debug log path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare log directory
        run: mkdir -p "$GITHUB_WORKSPACE/orca-logs"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-token-for-testing
          project_key: test-project
          path: "."
          config: "hardened/tests/fixtures/orca-config.yaml"
          custom_sast_controls: "hardened/tests/fixtures/custom-sast-controls"
          debug: "true"
          log_path: "orca-logs"
          show_annotations: "false"
          disable_err_report: "true"
          no_color: "true"
          timeout: 2m
      - name: Assert scan was attempted and handled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code output: '$EXIT_CODE'"
          if [ -n "$EXIT_CODE" ] && ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: exit_code output is not numeric"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: step succeeded but exit_code is '$EXIT_CODE' (expected 0)"
              exit 1
            fi
            echo "PASS: scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: step failed but exit_code output reports 0"
              exit 1
            fi
            echo "PASS: scan failed as expected with an invalid token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
