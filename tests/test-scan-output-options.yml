name: Test scan with output and filtering options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-api-token
          project_key: test-project
          path: .
          exclude_paths: "node_modules,dist"
          format: "sarif"
          output: "orca_test_results/"
          console_output: "table"
          preview_lines: "3"
          max_file_size: "5"
          display_name: "act-harness-scan"
          exit_code: "7"
          show_annotations: "false"
          disable_err_report: "true"
          no_color: "true"
          silent: "false"
          timeout: 2m
      - name: Assert scan ran (succeeded, or failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code output: '$EXIT_CODE'"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: action succeeded but exit_code output is '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: scan succeeded with exit_code 0"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: action failed but reported exit_code 0"
              exit 1
            fi
            echo "PASS: scan failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
