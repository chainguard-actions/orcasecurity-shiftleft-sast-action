name: Test scan with invalid Orca token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-token-for-testing
          project_key: test-project
          path: .
          show_annotations: "false"
          no_color: "true"
          disable_err_report: "true"
          timeout: 2m
      - name: Assert scan ran and failed gracefully on invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT_CODE" ]; then
              echo "FAIL: action succeeded but exit_code output is empty"
              exit 1
            fi
            echo "PASS: scan succeeded with exit_code=$EXIT_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan failed as expected with invalid Orca token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
